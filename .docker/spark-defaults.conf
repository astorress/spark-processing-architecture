spark.master                     spark://spark-master:7077
spark.app.name                   spark-processing-architecture
spark.driver.host                spark-lab
spark.driver.bindAddress         0.0.0.0
spark.executor.memory            768m
spark.driver.port                39000
spark.blockManager.port          39001
spark.ui.port                    4041
spark.eventLog.enabled           true
spark.eventLog.dir               file:/app/data/eventlog
spark.sql.shuffle.partitions     8
spark.sql.adaptive.enabled       true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled true
spark.sql.session.timeZone       America/Bogota
spark.serializer                 org.apache.spark.serializer.KryoSerializer
